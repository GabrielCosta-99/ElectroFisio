
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ElectroFisio - Entrar</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

    <header class="cabecalho">
        <div class="cabecalho-logo">
            <span class="logo-electro">Electro</span><span class="logo-fisio">Fisio</span>
        </div>

        <nav class="cabecalho-navegacao"
             aria-label="Navegação principal">
            <a href="#" class="botao-acessibilidade">
                Acessibilidade
            </a>
        </nav>
    </header>

    <main class="conteudo-principal">
        <section class="area-autenticacao">

            <!-- Formulário de login -->
            <div class="area-cadastro">
                <div class="cadastro-conteudo">

                    <h1>Login</h1>

                    <p class="cadastro-subtitulo">
                        Selecione seu perfil de acesso
                    </p>

                    <div class="selecao-perfil">
                        <button type="button" class="botao-perfil">
                            Profissional
                        </button>

                        <button type="button" class="botao-perfil">
                            Estudante
                        </button>
                    </div>

                    <p class="cadastro-instrucao">
                        Acesse sua conta com CREFITO e senha
                    </p>

                    <form class="formulario-cadastro">

                        <input
                            type="text"
                            name="crefito"
                            placeholder="CREFITO"
                            autocomplete="username"
                            required
                        >

                        <input
                            type="password"
                            name="senha"
                            placeholder="Senha"
                            autocomplete="current-password"
                            required
                        >

                        <a href="#" class="link-esqueci-senha">
                            Esqueceu sua senha?
                        </a>

                        <button type="submit" class="botao-cadastrar">
                            Entrar
                        </button>

                    </form>
                </div>
            </div>

            <!-- Painel verde -->
            <div class="painel-login">
                <div class="painel-login-conteudo">

                    <h2>Novo por aqui?</h2>

                    <p>
                        Crie sua conta para aprimorar seus
                        conhecimentos em TENS e FES.
                    </p>

                    <a href="login.html" class="botao-login">
                        Criar conta
                    </a>

                </div>
            </div>

        </section>
    </main>

</body>
</html>


<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ElectroFisio - Carregando</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tens-fes.css">
    <link rel="stylesheet" href="../css/telas-gerais.css">
    <link rel="stylesheet" href="../css/acessibilidade.css">

    <script src="../js/acessibilidade.js"></script>
</head>
<body>

    <!-- Cabeçalho -->
    <header class="cabecalho">
        <div class="cabecalho-logo">
            <span class="logo-electro">Electro</span><span class="logo-fisio">Fisio</span>
        </div>
    </header>

    <main class="conteudo-principal pagina-centralizada">

        <section class="carregamento" role="status" aria-live="polite">
            <div class="rodinha" aria-hidden="true"></div>

            <h1>Preparando seu ambiente</h1>
            <p>
                Estamos carregando seus dados.<br>
                Em instantes, tudo estará pronto para você.
            </p>

            <p class="texto-carregando">Carregando sistema...</p>
        </section>

        <p class="rodape-carregamento">
            Aguarde um instante. Não é necessário atualizar a página.
        </p>

    </main>

    <script src="../js/carregamento.js"></script>

</body>
</html>

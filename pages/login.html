
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ElectroFisio - Login</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">
    <script defer src="../js/validacao.js"></script>
    <script defer src="../js/login.js"></script>
    <link rel="stylesheet" href="../css/acessibilidade.css">

    <script src="../js/acessibilidade.js"></script>
</head>

<body>

    <!-- Cabeçalho padrão do sistema -->
    <header class="cabecalho">
        
<div class="cabecalho-logo">
    <span class="logo-electro">Electro</span><span class="logo-fisio">Fisio</span>
</div>


        <nav class="cabecalho-navegacao"
             aria-label="Navegação principal">
            <a href="acessibilidade.html" class="botao-acessibilidade">
                Acessibilidade
            </a>
        </nav>
    </header>

    <!-- Conteúdo específico de cada tela -->
   
<main class="conteudo-principal">

    <section class="area-autenticacao">

        <!-- Espaço cadastro -->
        
<!-- Área de cadastro -->
<div class="area-cadastro">

    <div class="cadastro-conteudo">

        <h1>Criar conta</h1>

        <p class="cadastro-subtitulo">
            Selecione seu perfil de acesso
        </p>

        
<!-- Seleção do perfil -->
<div class="selecao-perfil">

    <button type="button"
            class="botao-perfil"
            data-perfil="profissional"
            aria-pressed="false">
        Profissional
    </button>

    <button type="button"
            class="botao-perfil"
            data-perfil="estudante"
            aria-pressed="false">
        Estudante
    </button>

</div>

<p class="cadastro-instrucao">
    Preencha seus dados para cadastrar
</p>

<!-- Formulário -->
<form class="formulario-cadastro" id="formularioCadastro">

    <input type="hidden" name="tipoPerfil" id="tipoPerfil">

    <!-- DADOS PESSOAIS -->
    <input
        type="text"
        name="nome"
        placeholder="Nome completo"
        autocomplete="name"
        required
    >

    <input
        type="text"
        name="cpf"
        placeholder="CPF"
        maxlength="14"
        inputmode="numeric"
        required
    >

    <input
        type="date"
        name="nascimento"
        aria-label="Data de nascimento"
        required
    >

    <input
        type="email"
        name="email"
        placeholder="E-mail"
        autocomplete="email"
        required
    >

    <input
        type="tel"
        name="telefone"
        placeholder="Telefone"
        autocomplete="tel"
        required
    >

    <input
        type="password"
        name="senha"
        placeholder="Senha"
        autocomplete="new-password"
        required
    >

    <!-- CAMPOS DO PROFISSIONAL -->
    <div class="campos-perfil" id="camposProfissional" hidden>

        <input
            type="text"
            name="crefito"
            placeholder="CREFITO"
            disabled
            required
        >

        <input
            type="text"
            name="regiao"
            placeholder="Região do CREFITO"
            disabled
            required
        >

        <input
            type="text"
            name="especialidade"
            placeholder="Especialidade"
            disabled
        >

        <input
            type="text"
            name="vinculo"
            placeholder="Vínculo profissional"
            disabled
        >

    </div>

    <!-- CAMPOS DO ESTUDANTE -->
    <div class="campos-perfil" id="camposEstudante" hidden>

        <input
            type="text"
            name="curso"
            placeholder="Curso"
            disabled
            required
        >

        <input
            type="text"
            name="instituicao"
            placeholder="Instituição de ensino"
            disabled
            required
        >

        <input
            type="text"
            name="semestre"
            placeholder="Período / semestre"
            disabled
            required
        >

    </div>

    <button type="submit" class="botao-cadastrar">
        Cadastrar
    </button>

</form>


    </div>

</div>


        <!-- Painel de login -->
        <div class="painel-login">

            <div class="painel-login-conteudo">

                <h1>Já possui uma conta?</h1>

                <p>
                    Acesse a plataforma para ter acesso
                    aos seus estudos e simulações clínicas.
                </p>

                
<a href="entrar.html" class="botao-login">
    Fazer login
</a>


            </div>

        </div>

    </section>

</main>


</body>
</html>


<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ElectroFisio - Login</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <!-- Cabeçalho padrão do sistema -->
    <header class="cabecalho">
        
<div class="cabecalho-logo">
    <span class="logo-electro">Electro</span><span class="logo-fisio">Fisio</span>
</div>


        <nav class="cabecalho-navegacao"
             aria-label="Navegação principal">
            <a href="#" class="botao-acessibilidade">
                Acessibilidade
            </a>
        </nav>
    </header>

    <!-- Conteúdo específico de cada tela -->
   
<main class="conteudo-principal">

    <section class="area-autenticacao">

        <!-- Espaço cadastro -->
        
<!-- Área de cadastro -->
<div class="area-cadastro">

    <div class="cadastro-conteudo">

        <h1>Criar conta</h1>

        <p class="cadastro-subtitulo">
            Selecione seu perfil de acesso
        </p>

        <!-- Seleção do perfil -->
        <div class="selecao-perfil">

            <button type="button" class="botao-perfil">
                Profissional
            </button>

            <button type="button" class="botao-perfil">
                Estudante
            </button>

        </div>

        <p class="cadastro-instrucao">
            Preencha seus dados para cadastrar
        </p>

        <!-- Formulário -->
        <form class="formulario-cadastro">

            <input
                type="text"
                name="nome"
                placeholder="Nome completo"
                autocomplete="name"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="E-mail"
                autocomplete="email"
                required
            >

            <input
                type="password"
                name="senha"
                placeholder="Senha"
                autocomplete="new-password"
                required
            >

            <input
                type="text"
                name="curso"
                placeholder="Curso"
            >

            <input
                type="text"
                name="instituicao"
                placeholder="Instituição de ensino"
            >

            <input
                type="text"
                name="semestre"
                placeholder="Período / semestre"
            >

            <button type="submit" class="botao-cadastrar">
                Cadastrar
            </button>

        </form>

    </div>

</div>


        <!-- Painel de login -->
        <div class="painel-login">

            <div class="painel-login-conteudo">

                <h1>Já possui uma conta?</h1>

                <p>
                    Acesse a plataforma para ter acesso
                    aos seus estudos e simulações clínicas.
                </p>

                <button type="button" class="botao-login">
                    Fazer login
                </button>

            </div>

        </div>

    </section>

</main>


</body>
</html>

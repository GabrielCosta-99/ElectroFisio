
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ElectroFisio - Conteúdo</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tens-fes.css">
    <link rel="stylesheet" href="../css/conteudo.css">
    <link rel="stylesheet" href="../css/acessibilidade.css">

    <script src="../js/acessibilidade.js"></script>
    <script defer src="../js/menu.js"></script>
</head>
<body>

    <!-- Cabeçalho -->
    <header class="cabecalho">

        <div class="cabecalho-logo">
            <span class="logo-electro">Electro</span><span class="logo-fisio">Fisio</span>
        </div>

        <nav class="cabecalho-navegacao"
             aria-label="Navegação principal">
            <a href="inicio.html">Início</a>
            <a href="visao-geral.html">TENS e FES</a>
            <a href="conteudo.html" class="nav-ativo">Conteúdo</a>
            <a href="perfil.html">Meu Perfil</a>
            <a href="sair.html">Sair</a>
        </nav>

    </header>

    <main class="conteudo-principal pagina-tens-fes">

        <div class="linha-acessibilidade">
            <a href="acessibilidade.html">Acessibilidade</a>
        </div>

        <h1 class="titulo-conteudo">Conteúdo</h1>

        <!-- Abas: mostram uma seção por vez -->
        <nav class="abas abas-conteudo" role="tablist" aria-label="Seções do conteúdo">
            <button type="button" class="botao-aba ativo" role="tab" id="abaNovoMaterial"
                    aria-selected="true" aria-controls="novoMaterial" data-secao="novoMaterial">Criar material</button>
            <button type="button" class="botao-aba" role="tab" id="abaMeusMateriais"
                    aria-selected="false" aria-controls="meusMateriais" data-secao="meusMateriais">Meus materiais</button>
            <a href="ia.html" class="botao-aba">Enviar caso para a IA</a>
        </nav>

        <section class="coluna coluna-conteudo">

            <article class="card-info painel-conteudo" id="novoMaterial" role="tabpanel" aria-labelledby="abaNovoMaterial" tabindex="-1">
                <h2 id="tituloFormMaterial">Novo material de estudo</h2>

                <form class="formulario-conteudo" id="formMaterial">

                    <label>
                        Título
                        <input type="text" name="titulo" required
                               placeholder="Ex.: Resumo de TENS convencional">
                    </label>

                    <label>
                        Modalidade
                        <select name="modalidade">
                            <option value="TENS">TENS</option>
                            <option value="FES">FES</option>
                        </select>
                    </label>

                    <label>
                        Tema
                        <input type="text" name="tema"
                               placeholder="Ex.: parâmetros, eletrodos, segurança">
                    </label>

                    <label>
                        Texto
                        <textarea name="texto" rows="5"
                                  placeholder="Escreva o conteúdo do material"></textarea>
                    </label>

                    <label>
                        Anexo
                        <input type="file" name="anexo">
                    </label>

                    <label>
                        Referências
                        <textarea name="referencias" rows="2"
                                  placeholder="Livros, artigos ou manuais consultados"></textarea>
                    </label>

                    <p class="estado-material">
                        <strong>Estado:</strong> <span id="estadoMaterial">Rascunho</span>
                    </p>

                    <div class="acoes">
                        <button type="submit" class="botao-acao principal" data-estado="Em revisão">
                            Enviar para revisão
                        </button>
                        <button type="submit" class="botao-acao" data-estado="Rascunho">
                            Salvar rascunho
                        </button>
                        <button type="button" class="botao-acao botao-novo-material escondido" id="botaoNovoMaterial">
                            Novo material
                        </button>
                    </div>

                    <p class="mensagem-conteudo" id="mensagemMaterial" role="status"></p>
                </form>
            </article>

            <article class="card-info painel-conteudo" id="meusMateriais" role="tabpanel" aria-labelledby="abaMeusMateriais" tabindex="-1" hidden>
                <h2>Meus materiais</h2>

                <ul class="lista-materiais" id="listaMateriais"></ul>

                <p class="legenda-estados">
                    <strong>Estados:</strong> Rascunho → Em revisão → Aprovado (ou devolvido para ajustes pelo professor ou profissional)
                </p>
            </article>

        </section>

    </main>

    <script src="../js/conteudo.js"></script>

</body>
</html>
